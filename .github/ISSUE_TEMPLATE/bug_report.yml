name: Bug Report
description: File a bug report or unexpected behavior with the plugin
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### ⚠️ Security Warning
        **DO NOT** include your private API keys (`sk-...`), bearer tokens, passwords, or confidential gateway URLs in this issue. Sanitize all logs before submitting!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. In opencode.json, configure ...
        2. Run ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: What versions are you using?
      value: |
        - Plugin version: 0.1.3
        - OpenCode version:
        - OmniRoute version:
        - Node.js / Bun version:
        - OS (e.g. macOS / Linux / Windows):
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs (Sanitized)
      description: Paste any error messages or terminal logs here (ensure NO API keys are present).
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have verified that no private API keys or sensitive secrets are included in this report.
          required: true
